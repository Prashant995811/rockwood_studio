{% extends 'admin/base_admin.html' %}

{% block content %}
<div class="admin-header"><div><h1>{{ title }}</h1></div></div>
<section class="panel">
    <form method="post" class="admin-form">
        {{ form.hidden_tag() }}
        <label>{{ form.client_name.label }}{{ form.client_name() }}</label>
        <label>{{ form.rating.label }}{{ form.rating() }}</label>
        <label>{{ form.review.label }}{{ form.review(rows="6") }}</label>
        <label class="check">{{ form.is_featured() }} {{ form.is_featured.label.text }}</label>
        {{ form.submit(class_="btn-admin") }}
    </form>
</section>
{% endblock %}
